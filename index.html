<script>
  document.addEventListener('DOMContentLoaded', () => {
      // Function to convert text nodes to lowercase
      function convertTextToLowerCase(element) {
          // Skip elements that shouldn't be modified
          if (element.tagName && ['SCRIPT', 'STYLE', 'INPUT', 'TEXTAREA', 'PRE', 'CODE', 'IFRAME'].includes(element.tagName.toUpperCase())) {
              return;
          }
  
          // Process text nodes
          const walker = document.createTreeWalker(
              element,
              NodeFilter.SHOW_TEXT,
              null,
              false
          );
  
          const textNodes = [];
          let node;
          while (node = walker.nextNode()) {
              if (node.textContent.trim() !== '') {
                  textNodes.push(node);
              }
          }
  
          textNodes.forEach(node => {
              node.textContent = node.textContent.toLowerCase();
          });
      }
  
      // Initial conversion
      convertTextToLowerCase(document.body);
  
      // Observe DOM changes for React updates
      const observer = new MutationObserver(mutations => {
          mutations.forEach(mutation => {
              if (mutation.addedNodes.length) {
                  mutation.addedNodes.forEach(node => {
                      if (node.nodeType === Node.ELEMENT_NODE) {
                          convertTextToLowerCase(node);
                      } else if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '') {
                          node.textContent = node.textContent.toLowerCase();
                      }
                  });
              }
          });
      });
  
      // Start observing the document
      observer.observe(document.body, {
          childList: true,
          subtree: true
      });
  });
  </script>
